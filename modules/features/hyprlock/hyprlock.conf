general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(2e3440)
}

label {
    monitor =
    text = $TIME
    color = rgb(eceff4)
    font_size = 80
    font_family = sans-serif
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:15000] date '+%A, %-d %B'
    color = rgb(b8c2ce)
    font_size = 12
    font_family = sans-serif
    position = 0, -15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 46
    outline_thickness = 1
    rounding = -1
    outer_color = rgb(4c566a)
    inner_color = rgb(3b4252)
    font_color = rgb(88c0d0)
    check_color = rgb(88c0d0)
    fail_color = rgb(bf616a)
    capslock_color = rgb(ebcb8b)
    placeholder_text = <span foreground="##b8c2ce">Enter password</span>
    fail_text = <span foreground="##bf616a">Try again ($ATTEMPTS)</span>
    dots_size = 0.2
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT · Session secured
    color = rgb(b8c2ce)
    font_size = 11
    font_family = sans-serif
    position = 0, 24
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:15000] @battery@
    color = rgb(a3be8c)
    font_size = 11
    font_family = sans-serif
    position = -26, 24
    halign = right
    valign = bottom
}
