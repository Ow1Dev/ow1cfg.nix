general {
    lock_cmd = @lock@
    before_sleep_cmd = @loginctl@ lock-session
    after_sleep_cmd = @wlopm@ --on '*'
    inhibit_sleep = 3
}

# Dim, lock, then turn displays off. Restore on activity.
listener {
    timeout = 240
    on-timeout = @brightnessctl@ --save set 20%
    on-resume = @brightnessctl@ --restore
}

listener {
    timeout = 300
    on-timeout = @loginctl@ lock-session
}

listener {
    timeout = 330
    on-timeout = @wlopm@ --off '*'
    on-resume = @wlopm@ --on '*'
}
