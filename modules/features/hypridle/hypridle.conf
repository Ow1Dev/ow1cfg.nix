general {
    lock_cmd = @lock@
    before_sleep_cmd = @lock@
    after_sleep_cmd = @wlopm@ --on '*'
    # Auto-detect support; Mango does not implement hyprland-lock-notify-v1.
    inhibit_sleep = 2
}

# Dim, lock, then turn displays off. Restore on activity.
listener {
    timeout = 240
    on-timeout = @brightnessctl@ --save set 20%
    on-resume = @brightnessctl@ --restore
}

listener {
    timeout = 300
    on-timeout = @lock@
}

listener {
    timeout = 330
    on-timeout = @wlopm@ --off '*'
    on-resume = @wlopm@ --on '*'
}
